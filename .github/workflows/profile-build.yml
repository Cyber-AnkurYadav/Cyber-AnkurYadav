name: Build Profile Dashboard

on:
  schedule:
    - cron: "5 0 * * *"      # daily, keeps streak / stats / sprint progress fresh
  workflow_dispatch:
  push:
    paths: ["config.json", "scripts/**", "assets/avatar.jpg"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate dashboard SVGs
        run: python scripts/build.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit changes
        run: |
          git config user.name "profile-bot"
          git config user.email "profile-bot@users.noreply.github.com"
          git add assets/gen
          git diff --cached --quiet || (git commit -m "chore: refresh profile dashboard" && git push)
