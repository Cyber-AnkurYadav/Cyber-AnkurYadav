name: Generate Contribution Snake

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            output/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23ff4d8d&color_dots=%23151a2f,%233b2f8f,%236d4be0,%23a855f7,%23ff4d8d
      - name: Publish output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: output
          build_branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
